    <script>
        /**
         * 1. SISTEM AUDIO (TONE.JS)
         * Menghasilkan efek suara ramah anak tanpa bergantung file audio eksternal
         */
        const soundManager = {
            enabled: true,
            synth: null,
            init() {
                if (!this.synth && typeof Tone !== 'undefined') {
                    this.synth = new Tone.PolySynth(Tone.Synth).toDestination();
                    this.synth.volume.value = -8;
                }
            },
            toggle() {
                this.enabled = !this.enabled;
                const btn = document.getElementById('btn-sound');
                btn.innerHTML = this.enabled ? '🔊' : '🔇';
                btn.className = this.enabled 
                    ? 'p-2 rounded-xl bg-emerald-100 text-emerald-800 font-bold text-xs sm:text-sm transition'
                    : 'p-2 rounded-xl bg-slate-200 text-slate-500 font-bold text-xs sm:text-sm transition';
            },
            play(type) {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (Tone.context.state !== 'running') Tone.start();
                    const now = Tone.now();
                    if (type === 'correct') {
                        this.synth.triggerAttackRelease(['C5', 'E5', 'G5'], '16n', now);
                    } else if (type === 'wrong') {
                        this.synth.triggerAttackRelease(['E4', 'Eb4'], '8n', now);
                    } else if (type === 'levelup' || type === 'boss') {
                        this.synth.triggerAttackRelease(['C5', 'E5', 'G5', 'C6'], '8n', now);
                    } else if (type === 'click') {
                        this.synth.triggerAttackRelease(['G5'], '32n', now);
                    }
                } catch (e) { /* Abaikan jika browser memblokir autoplay audio */ }
            }
        };

                        opsi: ["Mampu menyegarkan udara kelas tanpa memerlukan penyiraman setiap hari dan tahan cahaya dalam ruangan", "Membutuhkan air dalam jumlah sangat banyak setiap pagi sebelum pelajaran dimulai", "Hanya dapat tumbuh subur jika terkena sinar matahari langsung di tengah lapangan", "Menghasilkan buah-buahan segar yang dapat dikonsumsi siswa saat jam istirahat"],

            init() {
                if (this.questions.length > 0) return;

                    const islandInfo = ISLANDS_DATA[islandId - 1];
                    const baseList = this.scenarios[islandId];

                    for (let i = 0; i < 100; i++) {
                        const base = baseList[i % baseList.length];
                        const ctx = this.contexts[Math.floor(i / baseList.length) % this.contexts.length];
                        const isBoss = (i === 99); // Soal ke-100 setiap pulau adalah BOSS QUESTION

                        // Pastikan proporsi kognitif terjaga: 20% LOTS, 30% MOTS, 50% HOTS
                        let levelKognitif = base.level;
                        let tingkatKesulitan = base.diff;
                        if (isBoss) {
                            levelKognitif = "HOTS";
                            tingkatKesulitan = "Sulit";
                        } else if (i % 10 < 2) {
                            levelKognitif = "LOTS";
                            tingkatKesulitan = "Mudah";
                        } else if (i % 10 < 5) {
                            levelKognitif = "MOTS";
                            tingkatKesulitan = "Sedang";
                        } else {
                            levelKognitif = "HOTS";
                            tingkatKesulitan = "Sulit";
                        }

                        // Variasikan stimulus agar kaya konteks & tidak identik
                        const variationNotes = [
                            "",
                            " Peristiwa ini diamati langsung oleh tim jurnalis cilik sekolah dalam buletin bulanan.",

                            " Bacaan ini merupakan bagian dari simulasi asesmen kompetensi literasi membaca nasional."
                        ];
                        const varIdx = Math.floor(i / baseList.length);
                        const enrichedStimulus = `${ctx.prefix} ${base.stimulus}${variationNotes[varIdx]}`;

                        // Koreksi index benar khusus soal grafik pulau 6 bila ada penyesuaian
                        const correctIdx = (typeof base.fixCorrectIndex === 'number') ? base.fixCorrectIndex : base.benar;

                        this.questions.push({
                            id: `TKA-P${islandId}-Q${String(i + 1).padStart(3, '0')}`,
                            num: globalId++,
                            islandId: islandId,
                            islandName: islandInfo.name,
                            materi: base.tema,
                            indikator: `Menganalisis dan menyimpulkan informasi pada materi ${base.tema} (${islandInfo.name})`,
                            levelKognitif: levelKognitif,
                            stimulus: enrichedStimulus,
                            pertanyaan: isBoss ? `👑 [BOSS CHALLENGE ${islandInfo.name.toUpperCase()}] ${base.tanya}` : base.tanya,
                            pilihan: [...base.opsi],
                            jawabanBenar: correctIdx,
                            pembahasan: base.bahas,
                            alasanBenar: `Pilihan tersebut paling tepat karena didukung langsung oleh bukti kontekstual dalam stimulus dan kaidah penalaran Bahasa Indonesia.`,
                            tips: base.tips,
                            kompetensi: islandInfo.topics[i % islandInfo.topics.length],
                            kesulitan: tingkatKesulitan,
                            poin: isBoss ? 50 : 10,
                            isBoss: isBoss
                        });
                    }
                }
            },

            getByIsland(islandId) {
                return this.questions.filter(q => q.islandId === islandId);
            },

            getRandomQuestions(count, filterFn = null) {
                let pool = filterFn ? this.questions.filter(filterFn) : [...this.questions];
                // Acak Fisher-Yates
                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
                return pool.slice(0, count);
            }
        };

            /* -------------------- HALAMAN 2: PETA INTERAKTIF 10 PULAU -------------------- */
            renderMap() {

                                            <span class="text-3xl bg-white/20 p-2 rounded-2xl">${isUnlocked ? isl.icon : '🔒'}</span>

                                        <div class="flex flex-wrap gap-1.5 mb-4">

                                        </div>
                                        <div class="space-y-1">
                                            <div class="flex justify-between text-xs font-bold text-slate-600">
                                                <span>Progres Pulau</span>
                                                <span>${progress} / 100 Soal</span>
                                            </div>
                                            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">

                                </div>
                                <div class="px-5 pb-5 pt-2 flex gap-2">
                                    ${isUnlocked ? `

                                        <button onclick="app.navigate('play', { mode: 'adventure', islandId: ${isl.id}, bossOnly: true })" class="btn-3d bg-amber-400 hover:bg-amber-500 border-amber-600 text-amber-950 font-extrabold py-2.5 px-3 rounded-2xl text-xs" title="Tantang Boss Pulau ${isl.id}">
                                            👑 Boss
                                        </button>
                                    ` : `
                                        <button disabled class="w-full bg-slate-200 text-slate-500 font-bold py-2.5 px-4 rounded-2xl text-sm cursor-not-allowed">

                        }).join('')}

                        <!-- Tujuan Akhir: ISTANA PERI PENGETAHUAN -->
                        <div class="md:col-span-2 lg:col-span-2 bg-gradient-to-br from-purple-600 via-indigo-700 to-sky-800 rounded-3xl p-6 text-white card-shadow flex flex-col sm:flex-row items-center justify-between gap-6 border-4 border-amber-300">
                            <div class="flex items-center gap-4">

            /* -------------------- HALAMAN 3: GAMEPLAY PETUALANGAN & LATIHAN SOAL -------------------- */
            startQuizSession(params) {
                let qList = [];
                let title = "";
                let mode = params.mode || 'adventure';
                let islandId = params.islandId || 1;

                if (mode === 'adventure') {
                    const island = ISLANDS_DATA[islandId - 1];
                    title = `${island.icon} ${island.name}`;
                    const allIslandQ = QuestionBankEngine.getByIsland(islandId);
                    if (params.bossOnly) {
                        // Ambil 5 soal terakhir termasuk Boss Question ke-100
                        qList = allIslandQ.slice(95, 100);
                        title = `👑 BOSS CHALLENGE — ${island.name}`;
                    } else {
                        // Ambil paket 10 soal berurutan dari progres saat ini (diakhiri soal ke-100 jika mencapai akhir)
                        const start = Math.min(params.startOffset || 0, 90);
                        qList = allIslandQ.slice(start, start + 10);
                    }
                } else {
                    title = params.title || "📚 Mode Latihan TKA";
                    qList = params.questions || QuestionBankEngine.getRandomQuestions(10);
                }

                // Acak pilihan jawaban setiap soal
                const preparedQuestions = qList.map(q => ui.shuffleOptions(q));

                this.quizSession = {
                    mode,
                    islandId,
                    title,
                    questions: preparedQuestions,
                    currentIndex: 0,
                    lives: 3,
                    maxLives: 3,
                    sessionScore: 0,
                    answeredCurrent: false,
                    selectedOption: null
                };

                this.renderQuizView();
            },

            renderQuizView() {
                const container = document.getElementById('app-container');
                const s = this.quizSession;
                const q = s.questions[s.currentIndex];

                if (!q) {
                    container.innerHTML = this.renderQuizSummary();
                    return;
                }

                // Render indikator nyawa/energi
                let heartsHtml = '';
                for (let i = 0; i < s.maxLives; i++) {
                    heartsHtml += i < s.lives ? '❤️' : '🤍';
                }

                // Badge Tingkat Kesulitan
                const diffBadge = q.kesulitan === 'Mudah' 
                    ? '🟢 MUDAH' 
                    : (q.kesulitan === 'Sedang' ? '🟡 SEDANG' : '🔴 SULIT');

                container.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-5">
                    <!-- Header Status Level -->
                    <div class="bg-white rounded-3xl p-4 sm:p-5 border-2 border-sky-200 card-shadow flex flex-wrap items-center justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <button onclick="app.navigate('${s.mode === 'adventure' ? 'map' : 'practice'}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-2 rounded-xl text-xs sm:text-sm">
                                ← Keluar
                            </button>
                            <div>
                                <h2 class="font-bold text-base sm:text-lg text-sky-900">${s.title}</h2>
                                <div class="text-xs text-slate-500 font-semibold">Soal ${s.currentIndex + 1} dari ${s.questions.length} • ID: ${q.id}</div>
                            </div>
                        </div>

                        <div class="flex items-center gap-3 sm:gap-4">
                            <div class="bg-rose-50 px-3 py-1.5 rounded-xl border border-rose-200 text-sm sm:text-base font-bold" title="Energi Belajar">
                                ${heartsHtml}
                            </div>
                            <div class="bg-amber-50 px-3 py-1.5 rounded-xl border border-amber-200 text-xs sm:text-sm font-extrabold text-amber-800">
                                +${s.sessionScore} Poin
                            </div>
                        </div>
                    </div>

                    <!-- Kartu Soal & Stimulus -->
                    <div class="bg-white rounded-3xl p-5 sm:p-8 border-2 ${q.isBoss ? 'border-amber-400 ring-4 ring-amber-100' : 'border-sky-100'} card-shadow">
                        <!-- Metadata Soal -->
                        <div class="flex flex-wrap items-center gap-2 mb-4">
                            <span class="text-xs font-extrabold px-3 py-1 rounded-full bg-indigo-100 text-indigo-800">
                                📚 ${q.materi}
                            </span>
                            <span class="text-xs font-extrabold px-3 py-1 rounded-full bg-purple-100 text-purple-800">
                                🧠 ${q.levelKognitif}
                            </span>
                            <span class="text-xs font-extrabold px-3 py-1 rounded-full bg-slate-100 text-slate-700">
                                ${diffBadge}
                            </span>
                            ${q.isBoss ? '<span class="text-xs font-extrabold px-3 py-1 rounded-full bg-amber-400 text-amber-950">👑 BOSS QUESTION (+50 Poin)</span>' : ''}
                        </div>

                        <!-- Kotak Stimulus (Bacaan/Tabel/Data) -->
                        <div class="bg-sky-50/80 border-l-4 border-sky-500 rounded-2xl p-4 sm:p-5 mb-6 text-slate-800 text-base sm:text-lg leading-relaxed whitespace-pre-line font-medium">
                            ${q.stimulus}
                        </div>

                        <!-- Pertanyaan -->
                        <h3 class="text-lg sm:text-xl font-bold text-slate-900 mb-5 leading-snug">
                            ${q.pertanyaan}
                        </h3>

                        <!-- 4 Pilihan Jawaban -->
                        <div class="space-y-3">
                            ${q.shuffledPilihan.map((optText, idx) => {
                                const letters = ['A', 'B', 'C', 'D'];
                                let btnStyle = "bg-white hover:bg-sky-50 border-slate-200 hover:border-sky-400 text-slate-800";
                                let statusIcon = "";

                                if (s.answeredCurrent) {
                                    if (idx === q.shuffledCorrectIndex) {
                                        btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-950 ring-2 ring-emerald-200";
                                        statusIcon = "✅ BENAR";
                                    } else if (idx === s.selectedOption) {
                                        btnStyle = "bg-rose-50 border-rose-500 text-rose-950";
                                        statusIcon = "❌ KURANG TEPAT";
                                    } else {
                                        btnStyle = "bg-slate-50 border-slate-200 text-slate-400 opacity-75";
                                    }
                                }

                                return `
                                <button ${s.answeredCurrent ? 'disabled' : `onclick="app.submitQuizAnswer(${idx})"`}
                                    class="w-full text-left p-4 rounded-2xl border-2 transition flex items-start justify-between gap-3 ${btnStyle}">
                                    <div class="flex items-start gap-3">
                                        <span class="w-8 h-8 shrink-0 rounded-xl bg-sky-100 text-sky-900 font-extrabold flex items-center justify-center text-sm">
                                            ${letters[idx]}
                                        </span>
                                        <span class="text-sm sm:text-base font-semibold pt-1">${optText}</span>
                                    </div>
                                    ${statusIcon ? `<span class="shrink-0 text-xs font-extrabold px-2.5 py-1 rounded-lg bg-white shadow-sm">${statusIcon}</span>` : ''}
                                </button>`;
                            }).join('')}
                        </div>

                        <!-- Kotak Pembahasan Edukatif (Muncul setelah menjawab) -->
                        ${s.answeredCurrent ? `
                        <div class="mt-6 p-5 rounded-2xl bg-gradient-to-r from-amber-50 to-yellow-50 border-2 border-amber-300 space-y-2.5">
                            <div class="flex items-center gap-2 font-extrabold text-amber-900 text-base">
                                <span>🧚</span>
                                <span>${s.selectedOption === q.shuffledCorrectIndex ? 'Hebat! Jawabanmu Tepat Sekali!' : 'Jangan Menyerah! Mari Kita Pelajari Bersama:'}</span>
                            </div>
                            <p class="text-sm text-slate-800"><strong>❓ Mengapa jawaban ini benar?</strong> ${q.alasanBenar}</p>
                            <p class="text-sm text-slate-800"><strong>📖 Pembahasan:</strong> ${q.pembahasan}</p>
                            <p class="text-sm text-indigo-900 bg-white/70 p-2.5 rounded-xl border border-amber-200"><strong>💡 Tips Peri Literasi:</strong> ${q.tips}</p>
                            <p class="text-xs font-bold text-slate-600">🎯 Kompetensi yang dilatih: ${q.kompetensi} (${q.indikator})</p>

                            <div class="pt-3 flex justify-end">
                                <button onclick="app.nextQuizQuestion()" class="btn-3d bg-emerald-500 hover:bg-emerald-600 border-emerald-700 text-white font-bold px-6 py-3 rounded-2xl text-sm sm:text-base">
                                    ${s.currentIndex + 1 < s.questions.length ? 'Soal Berikutnya →' : 'Lihat Hasil Petualangan 🏆'}
                                </button>
                            </div>
                        </div>` : ''}
                    </div>
                </div>`;
            },

            submitQuizAnswer(selectedIdx) {
                const s = this.quizSession;
                if (s.answeredCurrent) return;
                const q = s.questions[s.currentIndex];
                const isCorrect = (selectedIdx === q.shuffledCorrectIndex);

                s.answeredCurrent = true;
                s.selectedOption = selectedIdx;

                // Update statistik topik untuk sistem adaptif
                if (!gameState.topicStats[q.materi]) {
                    gameState.topicStats[q.materi] = { correct: 0, wrong: 0 };
                }

                if (!gameState.answeredIds.includes(q.id)) {
                    gameState.answeredIds.push(q.id);
                }

                if (isCorrect) {
                    soundManager.play('correct');
                    const pts = q.poin || 10;
                    s.sessionScore += pts;
                    gameState.score += pts;
                    gameState.coins += 5;
                    gameState.correctCount += 1;
                    gameState.topicStats[q.materi].correct += 1;

                    // Hapus dari daftar soal salah jika sebelumnya pernah salah
                    gameState.wrongQuestionIds = gameState.wrongQuestionIds.filter(id => id !== q.id);

                    // Update progres pulau jika mode adventure
                    if (s.mode === 'adventure') {
                        const currentProg = gameState.islandProgress[s.islandId] || 0;
                        if (currentProg < 100) {
                            gameState.islandProgress[s.islandId] = Math.min(100, currentProg + 1);
                        }
                        if (q.isBoss) {
                            this.handleBossVictory(s.islandId);
                        }
                    }
                } else {
                    soundManager.play('wrong');
                    s.lives = Math.max(0, s.lives - 1);
                    gameState.wrongCount += 1;
                    gameState.topicStats[q.materi].wrong += 1;

                    if (!gameState.wrongQuestionIds.includes(q.id)) {
                        gameState.wrongQuestionIds.push(q.id);
                    }

                    // Jika energi habis, pulihkan dengan pendekatan ramah anak
                    if (s.lives === 0) {
                        setTimeout(() => {
                            ui.showModal(
                                '🧚',
                                'Energi Belajar Habis, Yuk Isi Ulang!',
                                '<em>"Salah bukan berarti gagal. Salah berarti kesempatan untuk belajar."</em><br><br>Peri Literasi memberikanmu <strong>3 Energi Baru ❤️❤️❤️</strong> setelah kamu membaca pembahasan soal ini!',
                                `<button onclick="app.refillEnergy()" class="btn-3d bg-emerald-500 hover:bg-emerald-600 border-emerald-700 text-white font-bold px-6 py-2.5 rounded-2xl">Terima Energi & Lanjut Belajar</button>`
                            );
                        }, 400);
                    }
                }

                saveState();
                this.renderQuizView();
            },

            refillEnergy() {
                this.quizSession.lives = 3;
                ui.closeModal();
                this.renderQuizView();
            },

            handleBossVictory(islandId) {
                soundManager.play('boss');
                const island = ISLANDS_DATA[islandId - 1];
                gameState.islandBossDefeated[islandId] = true;
                gameState.islandProgress[islandId] = 100;
                gameState.stars += 1;
                gameState.gems += 2;
                if (!gameState.badges.includes(island.badge)) {
                    gameState.badges.push(island.badge);
                }
                if (islandId < 10 && gameState.unlockedIsland <= islandId) {
                    gameState.unlockedIsland = islandId + 1;
                } else if (islandId === 10) {
                    gameState.unlockedIsland = 11; // Buka Istana Peri!
                }
                saveState();
            },

            nextQuizQuestion() {
                this.quizSession.currentIndex += 1;
                this.quizSession.answeredCurrent = false;
                this.quizSession.selectedOption = null;
                this.renderQuizView();
            },

            renderQuizSummary() {
                const s = this.quizSession;
                const island = ISLANDS_DATA[s.islandId - 1];
                const isFinalBossDone = (s.islandId === 10 && gameState.islandBossDefeated[10]);

                return `
                <div class="max-w-2xl mx-auto bg-white rounded-3xl p-8 border-4 border-amber-300 card-shadow text-center space-y-5">

                    <h2 class="text-2xl sm:text-3xl font-bold text-sky-900">
                        ${isFinalBossDone ? 'SELAMAT! GERBANG ISTANA PERI TERBUKA!' : 'SESI PETUALANGAN SELESAI!'}
                    </h2>
                    <p class="text-slate-600">
                        ${isFinalBossDone 
                            ? 'Kamu berhasil menaklukkan 10 Pulau Pengetahuan dan mengalahkan Final Boss TKA!' 
                            : `Hebat! Kamu telah menyelesaikan rangkaian tantangan pada <strong>${s.title}</strong>.`}
                    </p>

                    <div class="grid grid-cols-3 gap-3 bg-sky-50 p-4 rounded-2xl border border-sky-200">
                        <div>
                            <div class="text-xs text-slate-500 font-bold">Poin Sesi</div>
                            <div class="text-xl font-extrabold text-amber-600">+${s.sessionScore}</div>
                        </div>
                        <div>
                            <div class="text-xs text-slate-500 font-bold">Bintang</div>
                            <div class="text-xl font-extrabold text-sky-700">⭐ ${gameState.stars}</div>
                        </div>
                        <div>
                            <div class="text-xs text-slate-500 font-bold">Total Skor</div>
                            <div class="text-xl font-extrabold text-emerald-700">${gameState.score}</div>
                        </div>
                    </div>

                    <div class="flex flex-wrap justify-center gap-3 pt-2">
                        ${isFinalBossDone ? `
                            <button onclick="app.navigate('castle')" class="btn-3d bg-amber-400 hover:bg-amber-300 border-amber-600 text-amber-950 font-extrabold px-6 py-3 rounded-2xl">
                                🏰 MASUK ISTANA PERI PENGETAHUAN
                            </button>
                        ` : `
                            <button onclick="app.navigate('map')" class="btn-3d bg-sky-500 hover:bg-sky-600 border-sky-700 text-white font-bold px-6 py-3 rounded-2xl">
                                🗺️ Kembali ke Peta Pulau
                            </button>
                            <button onclick="app.navigate('practice')" class="btn-3d bg-emerald-500 hover:bg-emerald-600 border-emerald-700 text-white font-bold px-6 py-3 rounded-2xl">
                                📚 Latihan Lagi
                            </button>
                        `}
                    </div>
                </div>`;
            },

            /* -------------------- HALAMAN 4: MODE LATIHAN & BANK 1.000 SOAL -------------------- */
            renderPracticeMenu() {
                const wrongCount = gameState.wrongQuestionIds.length;
                return `
                <div class="space-y-6">
                    <div class="bg-white rounded-3xl p-6 border-2 border-sky-200 card-shadow">
                        <h2 class="text-2xl sm:text-3xl font-bold text-sky-900 mb-1">📚 PUSAT LATIHAN BANK 1.000 SOAL TKA</h2>
                        <p class="text-slate-600 text-sm sm:text-base">Pilih mode latihan yang kamu inginkan. Setiap sesi mengacak soal dan pilihan jawaban secara otomatis!</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Mode 2: Latihan Cepat -->
                        <div class="bg-white rounded-3xl p-6 border-2 border-sky-100 card-shadow space-y-4">
                            <div class="flex items-center gap-3">
                                <span class="text-3xl bg-sky-100 p-2.5 rounded-2xl">⚡</span>
                                <div>
                                    <h3 class="text-lg font-bold text-sky-900">MODE LATIHAN CEPAT</h3>

                                        ${cnt} Soal

                        <!-- Mode 4 & 5: Soal Sulit HOTS & Ulangi Soal Salah -->

                                    <h3 class="text-lg font-bold text-amber-900">TANTANGAN HOTS & EVALUASI</h3>

                                </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <button onclick="app.startHotsPractice()" class="btn-3d bg-rose-500 hover:bg-rose-600 border-rose-700 text-white font-bold py-3 px-4 rounded-2xl text-sm">
                                    🔴 Khusus Soal Sulit (HOTS)
                                </button>
                                <button onclick="app.startWrongReview()" class="btn-3d bg-amber-500 hover:bg-amber-600 border-amber-700 text-white font-bold py-3 px-4 rounded-2xl text-sm">
                                    🔄 Ulangi Soal Salah (${wrongCount})
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Mode 3: Latihan Berdasarkan Materi (10 Pulau) -->
                    <div class="bg-white rounded-3xl p-6 border-2 border-sky-100 card-shadow">
                        <h3 class="text-lg font-bold text-sky-900 mb-4">🎯 LATIHAN BERDASARKAN MATERI KOMPETENSI (100 SOAL / MATERI)</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                            ${ISLANDS_DATA.map(isl => `
                                <button onclick="app.startTopicPractice(${isl.id})" class="p-4 rounded-2xl bg-slate-50 hover:bg-sky-50 border-2 border-slate-200 hover:border-sky-400 text-left transition">
                                    <div class="text-2xl mb-1">${isl.icon}</div>
                                    <div class="font-bold text-sm text-slate-800">${isl.name.replace('Pulau ', '')}</div>
                                    <div class="text-[11px] text-slate-500 mt-0.5">15 Soal Acak</div>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>`;
            },

            startQuickPractice(count) {
                const qs = QuestionBankEngine.getRandomQuestions(count);
                this.navigate('play', { mode: 'practice', title: `⚡ Latihan Cepat (${count} Soal)`, questions: qs });
            },

            startHotsPractice() {
                const qs = QuestionBankEngine.getRandomQuestions(15, q => q.levelKognitif === 'HOTS');
                this.navigate('play', { mode: 'practice', title: '🔥 Tantangan Khusus Soal HOTS', questions: qs });
            },

            startTopicPractice(islandId) {
                const isl = ISLANDS_DATA[islandId - 1];
                const qs = QuestionBankEngine.getRandomQuestions(15, q => q.islandId === islandId);
                this.navigate('play', { mode: 'practice', title: `${isl.icon} Latihan Materi: ${isl.name}`, questions: qs });
            },

            startWrongReview() {
                if (gameState.wrongQuestionIds.length === 0) {
                    ui.showModal('🌟', 'Belum Ada Soal Salah!', 'Hebat! Saat ini kamu tidak memiliki catatan soal yang salah. Coba ikuti latihan cepat atau jelajahi pulau baru!');
                    return;
                }
                const qs = QuestionBankEngine.questions.filter(q => gameState.wrongQuestionIds.includes(q.id));
                this.navigate('play', { mode: 'practice', title: '🔄 Evaluasi Soal yang Pernah Salah', questions: qs });
            },

            startAdaptivePractice(topicName) {
                let qs = [];
                if (topicName) {
                    qs = QuestionBankEngine.getRandomQuestions(10, q => q.materi === topicName);
                }
                if (qs.length === 0) qs = QuestionBankEngine.getRandomQuestions(10);
                this.navigate('play', { mode: 'practice', title: `🎯 Latihan Adaptif${topicName ? ': ' + topicName : ''}`, questions: qs });
            },

            /* -------------------- HALAMAN 5: ISTANA PERI & SIMULASI TKA CBT -------------------- */
            renderFairyCastle() {
                return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-gradient-to-br from-indigo-700 via-purple-700 to-pink-600 rounded-3xl p-8 text-white card-shadow text-center relative overflow-hidden">
                        <div class="text-7xl mb-3 animate-float">🏰</div>
                        <span class="bg-amber-300 text-amber-950 font-extrabold text-xs px-4 py-1 rounded-full">RUANG MAHKOTA TKA</span>
                        <h2 class="text-3xl sm:text-4xl font-bold mt-3 mb-2">ISTANA PERI PENGETAHUAN</h2>
                        <p class="text-purple-100 max-w-2xl mx-auto text-sm sm:text-base mb-6">
                            Selamat datang di pusat kehormatan para Petualang Cerdas! Di Ruang Mahkota ini, kamu dapat mengikuti <strong>Simulasi TKA Bahasa Indonesia Berbasis Komputer (CBT)</strong> untuk menguji seluruh kemampuanmu dan meraih <strong>Sertifikat Digital Resmi</strong>.
                        </p>
                        <div class="flex flex-wrap justify-center gap-4">
                            <button onclick="app.navigate('cbt')" class="btn-3d bg-amber-400 hover:bg-amber-300 border-amber-600 text-amber-950 font-extrabold px-7 py-4 rounded-2xl text-base shadow-xl">
                                💻 MULAI SIMULASI TKA CBT
                            </button>
                            ${gameState.cbtHistory.length > 0 ? `
                                <button onclick="app.navigate('certificate')" class="btn-3d bg-white hover:bg-purple-50 border-purple-300 text-purple-900 font-bold px-6 py-4 rounded-2xl text-base">
                                    🏆 LIHAT SERTIFIKAT TERAKHIR
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>`;
            },

            renderCbtEntryOrExam(container) {
                if (this.cbtSession.active) {
                    container.innerHTML = this.renderCbtExamScreen();
                    return;
                }
                if (this.cbtSession.finished && this.cbtSession.result) {
                    container.innerHTML = this.renderCbtResultScreen();
                    return;
                }

                // Layar Persiapan Simulasi CBT
                container.innerHTML = `
                <div class="max-w-3xl mx-auto bg-white rounded-3xl p-6 sm:p-8 border-2 border-indigo-200 card-shadow space-y-6">
                    <div class="flex items-center gap-4 border-b border-slate-100 pb-4">
                        <div class="text-5xl">💻</div>
                        <div>
                            <span class="text-xs font-extrabold bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full">COMPUTER BASED TEST (CBT)</span>
                            <h2 class="text-2xl font-bold text-slate-900 mt-1">SIMULASI TKA BAHASA INDONESIA</h2>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-200 text-sm">
                        <div><span class="text-slate-500">Nama Peserta:</span> <strong class="text-slate-900">${gameState.player.name}</strong></div>
                        <div><span class="text-slate-500">Kelas:</span> <strong class="text-slate-900">${gameState.player.className}</strong></div>
                        <div><span class="text-slate-500">Jumlah Soal:</span> <strong class="text-slate-900">30 Soal Komprehensif (HOTS & Narasi)</strong></div>
                        <div><span class="text-slate-500">Alokasi Waktu:</span> <strong class="text-rose-600">45 Menit (Timer Otomatis)</strong></div>
                    </div>

                    <div class="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-xl text-sm text-amber-950 space-y-1">
                        <div class="font-bold">📌 Petunjuk Pengerjaan Simulasi TKA:</div>
                        <ul class="list-disc list-inside space-y-1 text-xs sm:text-sm">
                            <li>Tampilan simulasi dioptimalkan untuk layar komputer/laptop dengan panel navigasi nomor soal di sebelah kiri.</li>
                            <li>Selama ujian berlangsung, kunci jawaban dan pembahasan tidak ditampilkan hingga kamu menekan tombol <strong>SELESAI SIMULASI</strong>.</li>
                            <li>Gunakan tombol <strong>Ragu-ragu</strong> (warna kuning) jika ingin menandai soal untuk diperiksa kembali.</li>
                        </ul>
                    </div>

                    <div class="flex flex-wrap justify-between items-center gap-3 pt-2">
                        <button onclick="app.navigate('home')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-5 py-3 rounded-2xl text-sm">
                            ← Kembali
                        </button>
                        <button onclick="app.startCbtExam()" class="btn-3d bg-indigo-600 hover:bg-indigo-700 border-indigo-800 text-white font-extrabold px-8 py-3.5 rounded-2xl text-base shadow-lg">
                            🚀 MULAI UJIAN SEKARANG
                        </button>
                    </div>
                </div>`;
            },

            startCbtExam() {
                soundManager.play('levelup');
                // Ambil 30 soal seimbang (3 soal dari setiap 10 pulau)
                let examQuestions = [];
                for (let isl = 1; isl <= 10; isl++) {
                    const qs = QuestionBankEngine.getRandomQuestions(3, q => q.islandId === isl);
                    examQuestions = examQuestions.concat(qs.map(q => ui.shuffleOptions(q)));
                }

                this.cbtSession = {
                    active: true,
                    questions: examQuestions,
                    answers: {},
                    doubtful: {},
                    currentIndex: 0,
                    timeLeftSeconds: 45 * 60, // 45 menit
                    timerInterval: null,
                    finished: false,
                    result: null
                };

                this.cbtSession.timerInterval = setInterval(() => {
                    this.cbtSession.timeLeftSeconds -= 1;
                    const timerEl = document.getElementById('cbt-timer-display');
                    if (timerEl) {
                        timerEl.textContent = this.formatTime(this.cbtSession.timeLeftSeconds);
                    }
                    if (this.cbtSession.timeLeftSeconds <= 0) {
                        this.finishCbtExam();
                    }
                }, 1000);

                document.getElementById('app-container').innerHTML = this.renderCbtExamScreen();
            },

            formatTime(sec) {
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            },

            renderCbtExamScreen() {
                const s = this.cbtSession;
                const q = s.questions[s.currentIndex];
                const selected = s.answers[s.currentIndex];
                const isDoubt = !!s.doubtful[s.currentIndex];

                return `
                <div class="space-y-4">
                    <!-- Header CBT -->
                    <div class="bg-slate-900 text-white rounded-2xl px-5 py-3.5 flex flex-wrap items-center justify-between gap-3 shadow-md">
                        <div class="flex items-center gap-3">
                            <span class="bg-sky-500 text-white font-extrabold px-3 py-1 rounded-lg text-xs">SIMULASI TKA CBT</span>
                            <span class="font-bold text-sm sm:text-base">${gameState.player.name} (${gameState.player.className})</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="bg-slate-800 border border-slate-700 px-4 py-1.5 rounded-xl font-mono text-base sm:text-lg font-bold text-amber-400">
                                ⏱️ <span id="cbt-timer-display">${this.formatTime(s.timeLeftSeconds)}</span>
                            </div>
                            <button onclick="app.confirmFinishCbt()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold px-4 py-2 rounded-xl text-xs sm:text-sm transition">
                                ✔ SELESAI SIMULASI
                            </button>
                        </div>
                    </div>

                    <!-- Layout CBT: Panel Kiri (Navigasi Nomor) + Panel Tengah (Soal) -->
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
                        <!-- PANEL KIRI: NOMOR SOAL -->
                        <div class="lg:col-span-3 bg-white rounded-2xl p-4 border-2 border-slate-200 shadow-sm h-fit">
                            <div class="font-bold text-sm text-slate-800 mb-3 pb-2 border-b border-slate-100 flex justify-between">
                                <span>Daftar Nomor Soal</span>
                                <span class="text-xs text-sky-600">${Object.keys(s.answers).length}/${s.questions.length} Terjawab</span>
                            </div>
                            <div class="grid grid-cols-6 sm:grid-cols-10 lg:grid-cols-5 gap-2">
                                ${s.questions.map((_, idx) => {
                                    const isCurrent = idx === s.currentIndex;
                                    const hasAns = s.answers[idx] !== undefined;
                                    const doubt = !!s.doubtful[idx];
                                    let cls = "bg-slate-100 text-slate-700 border-slate-300";
                                    if (doubt) cls = "bg-amber-400 text-amber-950 border-amber-600";
                                    else if (hasAns) cls = "bg-emerald-500 text-white border-emerald-700";
                                    if (isCurrent) cls += " ring-2 ring-sky-500 ring-offset-1 font-extrabold";

                                    return `
                                    <button onclick="app.cbtJump(${idx})" class="h-10 rounded-xl border text-xs sm:text-sm font-bold transition ${cls}">
                                        ${idx + 1}
                                    </button>`;
                                }).join('')}
                            </div>
                            <div class="mt-4 pt-3 border-t border-slate-100 text-[11px] text-slate-500 space-y-1">
                                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-emerald-500 inline-block"></span> Sudah dijawab</div>
                                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-amber-400 inline-block"></span> Ragu-ragu</div>
                                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-slate-200 inline-block"></span> Belum dijawab</div>
                            </div>
                        </div>

                        <!-- PANEL TENGAH: STIMULUS & PERTANYAAN -->
                        <div class="lg:col-span-9 bg-white rounded-2xl p-5 sm:p-7 border-2 border-slate-200 shadow-sm flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                                    <span class="bg-sky-100 text-sky-900 font-extrabold px-3.5 py-1 rounded-xl text-sm">
                                        SOAL NOMOR ${s.currentIndex + 1}
                                    </span>
                                    <span class="text-xs font-bold text-slate-500">Kompetensi: ${q.islandName} • ${q.materi}</span>
                                </div>

                                <!-- Stimulus -->
                                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 sm:p-5 mb-5 text-slate-800 text-base sm:text-lg leading-relaxed whitespace-pre-line">
                                    ${q.stimulus}
                                </div>

                                <!-- Pertanyaan -->
                                <h3 class="text-base sm:text-lg font-bold text-slate-900 mb-4">${q.pertanyaan}</h3>

                                <!-- Opsi A B C D -->
                                <div class="space-y-2.5">
                                    ${q.shuffledPilihan.map((opt, idx) => {
                                        const letters = ['A', 'B', 'C', 'D'];
                                        const active = selected === idx;
                                        return `
                                        <button onclick="app.cbtSelectOption(${idx})" class="w-full text-left p-3.5 rounded-xl border-2 transition flex items-start gap-3 ${active ? 'bg-sky-50 border-sky-600 text-sky-950 font-bold' : 'bg-white hover:bg-slate-50 border-slate-200 text-slate-800'}">
                                            <span class="w-7 h-7 shrink-0 rounded-lg flex items-center justify-center text-xs font-extrabold ${active ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-700'}">
                                                ${letters[idx]}
                                            </span>
                                            <span class="text-sm sm:text-base pt-0.5">${opt}</span>
                                        </button>`;
                                    }).join('')}
                                </div>
                            </div>

                            <!-- FOOTER CBT: Sebelumnya | Ragu-ragu | Berikutnya -->
                            <div class="mt-8 pt-4 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3">
                                <button onclick="app.cbtPrev()" ${s.currentIndex === 0 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl font-bold text-sm ${s.currentIndex === 0 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-slate-200 hover:bg-slate-300 text-slate-800'}">
                                    ← Sebelumnya
                                </button>

                                <button onclick="app.cbtToggleDoubt()" class="px-4 py-2.5 rounded-xl font-bold text-sm border-2 ${isDoubt ? 'bg-amber-400 border-amber-600 text-amber-950' : 'bg-amber-50 border-amber-300 text-amber-800'}">
                                    🚩 ${isDoubt ? 'Tanda Ragu Aktif' : 'Ragu-ragu'}
                                </button>

                                ${s.currentIndex < s.questions.length - 1 ? `
                                    <button onclick="app.cbtNext()" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-sky-600 hover:bg-sky-700 text-white">
                                        Berikutnya →
                                    </button>
                                ` : `
                                    <button onclick="app.confirmFinishCbt()" class="px-5 py-2.5 rounded-xl font-extrabold text-sm bg-emerald-600 hover:bg-emerald-700 text-white">
                                        ✔ Selesai Simulasi
                                    </button>
                                `}
                            </div>
                        </div>
                    </div>
                </div>`;
            },

            cbtSelectOption(optIdx) {
                this.cbtSession.answers[this.cbtSession.currentIndex] = optIdx;
                document.getElementById('app-container').innerHTML = this.renderCbtExamScreen();
            },
            cbtToggleDoubt() {
                const idx = this.cbtSession.currentIndex;
                this.cbtSession.doubtful[idx] = !this.cbtSession.doubtful[idx];
                document.getElementById('app-container').innerHTML = this.renderCbtExamScreen();
            },
            cbtJump(idx) {
                this.cbtSession.currentIndex = idx;
                document.getElementById('app-container').innerHTML = this.renderCbtExamScreen();
            },
            cbtPrev() {
                if (this.cbtSession.currentIndex > 0) {
                    this.cbtSession.currentIndex--;
                    document.getElementById('app-container').innerHTML = this.renderCbtExamScreen();
                }
            },
            cbtNext() {
                if (this.cbtSession.currentIndex < this.cbtSession.questions.length - 1) {
                    this.cbtSession.currentIndex++;
                    document.getElementById('app-container').innerHTML = this.renderCbtExamScreen();
                }
            },
            confirmFinishCbt() {
                const answered = Object.keys(this.cbtSession.answers).length;
                const total = this.cbtSession.questions.length;
                ui.showModal(
                    '📝',
                    'Konfirmasi Selesai Simulasi TKA',
                    `Kamu telah menjawab <strong>${answered} dari ${total} soal</strong>.<br>Apakah kamu yakin ingin mengakhiri simulasi dan melihat hasil penilaian?`,
                    `<button onclick="ui.closeModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-5 py-2.5 rounded-2xl">Kembali Periksa</button>
                     <button onclick="ui.closeModal(); app.finishCbtExam()" class="btn-3d bg-emerald-500 hover:bg-emerald-600 border-emerald-700 text-white font-bold px-5 py-2.5 rounded-2xl">Ya, Selesaikan</button>`
                );
            },

            finishCbtExam() {
                clearInterval(this.cbtSession.timerInterval);
                const s = this.cbtSession;
                let correct = 0;
                let wrong = 0;
                let unanswered = 0;

                // Analisis per kompetensi pulau
                const domainBreakdown = {};

                s.questions.forEach((q, idx) => {
                    const dom = q.islandName.replace('Pulau ', '');
                    if (!domainBreakdown[dom]) domainBreakdown[dom] = { total: 0, correct: 0 };
                    domainBreakdown[dom].total += 1;

                    const ans = s.answers[idx];
                    if (ans === undefined) {
                        unanswered += 1;
                    } else if (ans === q.shuffledCorrectIndex) {
                        correct += 1;
                        domainBreakdown[dom].correct += 1;
                    } else {
                        wrong += 1;
                    }
                });

                const total = s.questions.length;
                const score = Math.round((correct / total) * 100);
                const elapsedSeconds = (45 * 60) - s.timeLeftSeconds;
                const durationText = `${Math.floor(elapsedSeconds / 60)} menit ${elapsedSeconds % 60} detik`;

                // Tentukan Gelar/Predikat Virtual
                let titleBadge = "🏆 PEMULA CERDAS";
                if (score >= 90) titleBadge = "👑 RAJA/RATU TKA BAHASA INDONESIA";
                else if (score >= 80) titleBadge = "🏆 MASTER BAHASA INDONESIA";
                else if (score >= 70) titleBadge = "🏆 AHLI LITERASI";
                else if (score >= 55) titleBadge = "🏆 PENJELAJAH BAHASA";

                // Cari kompetensi terlemah untuk rekomendasi
                let weakDomains = [];
                let strongDomains = [];
                Object.entries(domainBreakdown).forEach(([dom, val]) => {
                    const pct = (val.correct / val.total) * 100;
                    if (pct < 67) weakDomains.push(dom);
                    else strongDomains.push(dom);
                });

                const resultObj = {
                    date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }),
                    total, correct, wrong, unanswered, score,
                    durationText, titleBadge, domainBreakdown, weakDomains, strongDomains
                };

                s.active = false;
                s.finished = true;
                s.result = resultObj;

                gameState.cbtHistory.push(resultObj);
                gameState.score += (correct * 15);
                saveState();
                soundManager.play('levelup');

                document.getElementById('app-container').innerHTML = this.renderCbtResultScreen();
            },

            renderCbtResultScreen() {
                const r = this.cbtSession.result;
                return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-white rounded-3xl p-6 sm:p-8 border-2 border-indigo-200 card-shadow">
                        <div class="text-center border-b border-slate-100 pb-6 mb-6">
                            <span class="bg-indigo-100 text-indigo-800 text-xs font-extrabold px-3.5 py-1 rounded-full">LAPORAN HASIL SIMULASI TKA</span>
                            <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 mt-2">HASIL SIMULASI TKA BAHASA INDONESIA</h2>
                            <p class="text-slate-600 text-sm mt-1">Peserta: <strong>${gameState.player.name}</strong> • ${gameState.player.className} • Waktu: ${r.durationText}</p>
                            
                            <div class="mt-4 inline-block bg-gradient-to-r from-amber-400 to-yellow-500 text-amber-950 font-extrabold px-6 py-2.5 rounded-2xl text-base sm:text-lg shadow">
                                ${r.titleBadge}
                            </div>
                        </div>

                        <!-- Statistik Nilai -->
                        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-center mb-6">
                            <div class="bg-indigo-600 text-white p-4 rounded-2xl col-span-2 sm:col-span-1">
                                <div class="text-xs opacity-80 font-bold">NILAI AKHIR</div>
                                <div class="text-3xl font-extrabold">${r.score}</div>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                <div class="text-xs text-slate-500 font-bold">Jumlah Soal</div>
                                <div class="text-xl font-extrabold text-slate-800">${r.total}</div>
                            </div>
                            <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200">
                                <div class="text-xs text-emerald-700 font-bold">Benar</div>
                                <div class="text-xl font-extrabold text-emerald-700">${r.correct}</div>
                            </div>
                            <div class="bg-rose-50 p-4 rounded-2xl border border-rose-200">
                                <div class="text-xs text-rose-700 font-bold">Salah</div>
                                <div class="text-xl font-extrabold text-rose-700">${r.wrong}</div>
                            </div>
                            <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200">
                                <div class="text-xs text-amber-700 font-bold">Kosong</div>
                                <div class="text-xl font-extrabold text-amber-700">${r.unanswered}</div>
                            </div>
                        </div>

                        <!-- Analisis Kemampuan Per Materi -->
                        <h3 class="font-bold text-lg text-slate-800 mb-3">📊 ANALISIS KEMAMPUAN PER KOMPETENSI</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                            ${Object.entries(r.domainBreakdown).map(([dom, val]) => {
                                const starsCount = Math.max(1, Math.round((val.correct / val.total) * 5));
                                const starsStr = '⭐'.repeat(starsCount) + '☆'.repeat(5 - starsCount);
                                return `
                                <div class="flex items-center justify-between bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
                                    <span class="font-bold text-slate-700">${dom} (${val.correct}/${val.total})</span>
                                    <span>${starsStr}</span>
                                </div>`;
                            }).join('')}
                        </div>

                        <!-- Rekomendasi Tindak Lanjut -->
                        <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 mb-6 text-sm space-y-1.5">
                            <div class="font-bold text-amber-900">💡 Rekomendasi Pengembangan Kemampuan:</div>
                            <p class="text-slate-700">
                                <strong>Kompetensi Dikuasai:</strong> ${r.strongDomains.length > 0 ? r.strongDomains.join(', ') : 'Terus tingkatkan latihanmu!'}
                            </p>
                            <p class="text-slate-700">
                                <strong>Perlu Dilatih Kembali:</strong> ${r.weakDomains.length > 0 ? `Latih kembali kemampuan pada materi <strong>${r.weakDomains.join(', ')}</strong>.` : 'Luar biasa! Seluruh kompetensi sudah dikuasai dengan sangat baik.'}
                            </p>
                        </div>

                        <div class="flex flex-wrap justify-between gap-3">
                            <button onclick="app.cbtSession.finished = false; app.navigate('cbt')" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-5 py-3 rounded-2xl text-sm">
                                🔄 Ulangi Simulasi
                            </button>
                            <button onclick="app.navigate('certificate')" class="btn-3d bg-amber-400 hover:bg-amber-300 border-amber-600 text-amber-950 font-extrabold px-6 py-3 rounded-2xl text-sm sm:text-base shadow">
                                🏆 CETAK SERTIFIKAT PETUALANG TKA
                            </button>
                        </div>
                    </div>
                </div>`;
            },

            /* -------------------- HALAMAN 6: SERTIFIKAT VIRTUAL -------------------- */
            renderCertificate() {
                const latest = gameState.cbtHistory.length > 0 
                    ? gameState.cbtHistory[gameState.cbtHistory.length - 1] 
                    : { score: Math.min(100, Math.round((gameState.correctCount / Math.max(1, gameState.correctCount + gameState.wrongCount)) * 100)), titleBadge: "🏆 PENJELAJAH BAHASA", date: new Date().toLocaleDateString('id-ID') };

                return `
                <div class="max-w-4xl mx-auto space-y-5">
                    <div class="flex justify-between items-center no-print">
                        <button onclick="app.navigate('home')" class="bg-white hover:bg-slate-100 text-slate-700 font-bold px-4 py-2 rounded-xl border border-slate-200 text-sm">
                            ← Kembali ke Beranda
                        </button>
                        <button onclick="window.print()" class="btn-3d bg-emerald-600 hover:bg-emerald-700 border-emerald-800 text-white font-extrabold px-6 py-2.5 rounded-2xl text-sm shadow">
                            🖨️ CETAK SERTIFIKAT
                        </button>
                    </div>

                    <!-- Bingkai Sertifikat Digital -->
                    <div id="certificate-printable" class="bg-white rounded-3xl p-8 sm:p-12 border-8 border-double border-amber-400 shadow-2xl text-center relative overflow-hidden">
                        <div class="text-5xl mb-2">🏆</div>
                        <div class="text-xs font-extrabold tracking-widest text-amber-600 uppercase">Penghargaan Prestasi Literasi</div>
                        <h2 class="text-2xl sm:text-4xl font-bold text-sky-950 mt-1 mb-4">SERTIFIKAT PETUALANG TKA</h2>
                        
                        <p class="text-slate-600 text-sm sm:text-base">Diberikan dengan bangga kepada:</p>
                        <div class="text-2xl sm:text-4xl font-extrabold text-indigo-800 my-3 border-b-2 border-amber-300 inline-block px-8 pb-1">
                            ${gameState.player.name}
                        </div>
                        <div class="text-sm font-bold text-slate-500 mb-4">${gameState.player.className} — ${gameState.player.school}</div>

                        <p class="text-slate-700 text-sm sm:text-base max-w-xl mx-auto leading-relaxed mb-6">
                            Telah berhasil menyelesaikan tantangan literasi pada gim edukasi<br>
                            <strong>PETUALANGAN TKA BAHASA INDONESIA KELAS 6 SD</strong><br>
                            <em>"Jelajah 10 Pulau Menuju Istana Peri"</em>
                        </p>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-lg mx-auto bg-amber-50/80 border-2 border-amber-200 rounded-2xl p-4 mb-8">
                            <div>
                                <div class="text-xs text-slate-500 font-bold">SKOR PENCAPAIAN</div>
                                <div class="text-2xl font-extrabold text-sky-900">${latest.score} / 100</div>
                            </div>
                            <div>
                                <div class="text-xs text-slate-500 font-bold">PREDIKAT GELAR</div>
                                <div class="text-base font-extrabold text-amber-800 pt-1">${latest.titleBadge}</div>
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row justify-between items-center max-w-xl mx-auto pt-4 border-t border-slate-200 text-xs sm:text-sm text-slate-600 gap-4">
                            <div>Tanggal: <strong>${latest.date}</strong></div>
                            <div class="text-center">
                                <div class="text-xs text-slate-400 mb-1">Pengembang Aplikasi & Pembimbing</div>
                                <div class="font-extrabold text-indigo-900 text-base">HERNAWATY HUSAIN</div>
                            </div>
                        </div>
                    </div>
                </div>`;
            },

            /* -------------------- HALAMAN 7: DASHBOARD SISWA & PROGRES ORANG TUA -------------------- */
            renderProfile() {
                const totalAnswered = gameState.correctCount + gameState.wrongCount;
                const accuracy = totalAnswered > 0 ? Math.round((gameState.correctCount / totalAnswered) * 100) : 0;
                const weakTopic = this.getWeakestTopic();

                return `
                <div class="space-y-6">
                    <!-- Pengaturan Profil Siswa -->
                    <div class="bg-white rounded-3xl p-6 border-2 border-sky-200 card-shadow">
                        <h2 class="text-2xl font-bold text-sky-900 mb-4">👤 DASHBOARD PROFIL SISWA & LAPORAN ORANG TUA</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">Nama Siswa</label>
                                <input id="inp-player-name" type="text" value="${gameState.player.name}" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-sky-500 outline-none font-bold text-slate-800">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">Kelas</label>
                                <input id="inp-player-class" type="text" value="${gameState.player.className}" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-sky-500 outline-none font-bold text-slate-800">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">Sekolah</label>
                                <div class="flex gap-2">
                                    <input id="inp-player-school" type="text" value="${gameState.player.school}" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-sky-500 outline-none font-bold text-slate-800">
                                    <button onclick="app.saveProfileForm()" class="btn-3d bg-sky-500 hover:bg-sky-600 border-sky-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm shrink-0">
                                        Simpan
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Ringkasan Progres Anak (Tampilan Ramah Orang Tua) -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white rounded-3xl p-6 border-2 border-emerald-100 card-shadow space-y-4">
                            <h3 class="text-lg font-bold text-emerald-900">👨‍👩‍👧 RINGKASAN PROGRES ANAK (UNTUK ORANG TUA)</h3>
                            <div class="space-y-2.5 text-sm">
                                <div class="flex justify-between py-2 border-b border-slate-100">
                                    <span class="text-slate-500">Nama Anak</span>
                                    <strong class="text-slate-900">${gameState.player.name} (${gameState.player.className})</strong>
                                </div>
                                <div class="flex justify-between py-2 border-b border-slate-100">
                                    <span class="text-slate-500">Pulau Terakhir Dicapai</span>
                                    <strong class="text-sky-700">Pulau ${Math.min(gameState.unlockedIsland, 10)} — ${ISLANDS_DATA[Math.min(gameState.unlockedIsland, 10) - 1].name}</strong>
                                </div>
                                <div class="flex justify-between py-2 border-b border-slate-100">
                                    <span class="text-slate-500">Total Soal Dikerjakan</span>
                                    <strong class="text-slate-900">${gameState.answeredIds.length} dari 1.000 Soal</strong>
                                </div>
                                <div class="flex justify-between py-2 border-b border-slate-100">
                                    <span class="text-slate-500">Jawaban Benar / Salah</span>
                                    <strong><span class="text-emerald-600">${gameState.correctCount} Benar</span> • <span class="text-rose-600">${gameState.wrongCount} Salah</span> (${accuracy}%)</strong>
                                </div>
                                <div class="flex justify-between py-2 border-b border-slate-100">
                                    <span class="text-slate-500">Skor Petualangan</span>
                                    <strong class="text-amber-600">${gameState.score.toLocaleString('id-ID')} Poin</strong>
                                </div>
                                <div class="flex justify-between py-2">
                                    <span class="text-slate-500">Materi yang Perlu Dilatih</span>
                                    <strong class="text-rose-700">${weakTopic || 'Belum terdeteksi kelemahan'}</strong>
                                </div>
                            </div>
                        </div>

                        <!-- Koleksi Lencana / Badge -->
                        <div class="bg-white rounded-3xl p-6 border-2 border-amber-100 card-shadow">
                            <h3 class="text-lg font-bold text-amber-900 mb-3">🏅 KOLEKSI LENCANA PETUALANG (${gameState.badges.length}/10)</h3>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                ${ISLANDS_DATA.map(isl => {
                                    const earned = gameState.badges.includes(isl.badge);
                                    return `
                                    <div class="p-3 rounded-2xl border text-center ${earned ? 'bg-amber-50 border-amber-300 text-amber-950' : 'bg-slate-50 border-slate-200 text-slate-400 grayscale'}">
                                        <div class="text-2xl mb-1">${earned ? isl.icon : '🔒'}</div>
                                        <div class="text-xs font-extrabold">${isl.badge}</div>
                                    </div>`;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                </div>`;
            },

            saveProfileForm() {
                const name = document.getElementById('inp-player-name').value.trim();
                const cls = document.getElementById('inp-player-class').value.trim();
                const sch = document.getElementById('inp-player-school').value.trim();
                if (name) gameState.player.name = name;
                if (cls) gameState.player.className = cls;
                if (sch) gameState.player.school = sch;
                saveState();
                ui.showModal('✅', 'Profil Tersimpan', `Data siswa <strong>${gameState.player.name}</strong> telah diperbarui dan tersimpan otomatis di browser.`);
                this.navigate('profile');
            },

            /* -------------------- HALAMAN 8: DASHBOARD GURU -------------------- */
            renderTeacherDashboard(filterClass = 'ALL') {
                const students = gameState.studentsRegistry
                    .filter(s => filterClass === 'ALL' || s.className === filterClass)
                    .sort((a, b) => b.score - a.score);

                const weakTopic = this.getWeakestTopic() || "Inferensi Logis & Simpulan Paragraf";

                return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-indigo-800 to-sky-800 rounded-3xl p-6 text-white card-shadow flex flex-col md:flex-row items-center justify-between gap-4">
                        <div>
                            <span class="bg-white/20 text-xs font-extrabold px-3 py-1 rounded-full">PANEL PEMANTAUAN PENDIDIK</span>
                            <h2 class="text-2xl sm:text-3xl font-bold mt-1">👩‍🏫 DASHBOARD GURU TKA BAHASA INDONESIA</h2>
                            <p class="text-sky-100 text-sm">Pantau perkembangan siswa kelas VI, peringkat skor, analisis materi tersulit, dan hasil simulasi CBT.</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <label class="text-xs font-bold">Filter Kelas:</label>
                            <select onchange="document.getElementById('app-container').innerHTML = app.renderTeacherDashboard(this.value)" class="bg-white text-slate-900 font-bold text-sm px-3 py-2 rounded-xl">
                                <option value="ALL" ${filterClass === 'ALL' ? 'selected' : ''}>Semua Kelas</option>
                                <option value="Kelas VI-A" ${filterClass === 'Kelas VI-A' ? 'selected' : ''}>Kelas VI-A</option>
                                <option value="Kelas VI-B" ${filterClass === 'Kelas VI-B' ? 'selected' : ''}>Kelas VI-B</option>
                            </select>
                        </div>
                    </div>

                    <!-- Statistik Ringkas Kelas -->
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-2xl border-2 border-slate-100 card-shadow">
                            <div class="text-xs font-bold text-slate-500">Jumlah Siswa Terdaftar</div>
                            <div class="text-2xl font-extrabold text-indigo-800 mt-1">${students.length} Siswa</div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border-2 border-slate-100 card-shadow">
                            <div class="text-xs font-bold text-slate-500">Bank Soal Aktif</div>
                            <div class="text-2xl font-extrabold text-emerald-700 mt-1">1.000 Soal HOTS</div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border-2 border-slate-100 card-shadow">
                            <div class="text-xs font-bold text-slate-500">Rata-rata Skor CBT</div>
                            <div class="text-2xl font-extrabold text-sky-700 mt-1">
                                ${students.length ? Math.round(students.reduce((a, b) => a + b.cbtScore, 0) / students.length) : 0} / 100
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border-2 border-rose-100 card-shadow">
                            <div class="text-xs font-bold text-rose-600">Materi Paling Sulit</div>
                            <div class="text-sm font-extrabold text-slate-800 mt-1">${weakTopic}</div>
                        </div>
                    </div>

                    <!-- Tabel Ranking & Perkembangan Siswa -->
                    <div class="bg-white rounded-3xl p-6 border-2 border-slate-100 card-shadow overflow-x-auto">
                        <h3 class="text-lg font-bold text-slate-900 mb-4">🏆 PERINGKAT & PERKEMBANGAN BELAJAR SISWA</h3>
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-100 text-slate-700 border-b border-slate-200">
                                    <th class="p-3 rounded-tl-xl">Rank</th>
                                    <th class="p-3">Nama Siswa</th>
                                    <th class="p-3">Kelas</th>
                                    <th class="p-3">Pulau Terakhir</th>
                                    <th class="p-3">Soal Selesai</th>
                                    <th class="p-3">Skor Petualangan</th>
                                    <th class="p-3 rounded-tr-xl">Nilai CBT</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${students.map((st, i) => `
                                <tr class="border-b border-slate-100 hover:bg-sky-50/50">
                                    <td class="p-3 font-extrabold">${i === 0 ? '🥇 1' : i === 1 ? '🥈 2' : i === 2 ? '🥉 3' : i + 1}</td>
                                    <td class="p-3 font-bold text-slate-900">${st.name}</td>
                                    <td class="p-3 text-slate-600">${st.className}</td>
                                    <td class="p-3"><span class="bg-sky-100 text-sky-800 text-xs font-bold px-2.5 py-1 rounded-lg">Pulau ${st.island}</span></td>
                                    <td class="p-3 font-semibold">${st.solved} / 1.000</td>
                                    <td class="p-3 font-extrabold text-amber-600">${st.score.toLocaleString('id-ID')}</td>
                                    <td class="p-3 font-extrabold text-emerald-700">${st.cbtScore > 0 ? st.cbtScore : '-'}</td>
                                </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
            },

            getWeakestTopic() {
                let worstTopic = null;
                let maxWrong = 0;
                Object.entries(gameState.topicStats).forEach(([topic, st]) => {
                    if (st.wrong > maxWrong && st.wrong >= st.correct) {
                        maxWrong = st.wrong;
                        worstTopic = topic;
                    }
                });
                return worstTopic;
            },

            unlockAllDemo() {
                gameState.unlockedIsland = 11;
                saveState();
                ui.showModal('🔑', 'Mode Pratinjau Aktif!', 'Seluruh <strong>10 Pulau Pengetahuan</strong> dan <strong>Istana Peri</strong> kini telah terbuka agar siswa maupun guru dapat langsung mencoba semua level!');
                this.navigate('map');
            }
        };

        // Jalankan aplikasi saat halaman siap
        window.onload = () => app.init();
    </script>
</body>
</html>
